name: test

on:
  push:
    branches-ignore: [trunk]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_pages_artifact:
        description: Upload the tested production build for Pages deployment
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run test:browse
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Upload tested Pages artifact
        if: inputs.upload_pages_artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
